<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forge Your Sword</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Intentionally a dark-fantasy game: same palette in every theme */
:root{--bg:#120d0a;--panel:#1e1612;--panel2:#2a1f18;--ink:#f4e9d8;--muted:#a89580;--gold:#ffc94d;--ember:#ff7a1a;--good:#5be37d;--bad:#ff4d4d;--warn:#ffae42;--jack:#c77dff;--line:#3b2c22;--grey:#6d6358;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
:root[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(120% 60% at 50% 0,#2b1a10 0,var(--bg) 60%) fixed;color:var(--ink);font:15px/1.4 "Trebuchet MS",system-ui,sans-serif;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.app{max-width:520px;margin:0 auto;padding:12px 14px 24px;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:center}
.logo{font-family:Cinzel,Georgia,serif;font-size:19px;letter-spacing:.5px}.logo b{color:var(--ember)}
.hud{display:flex;gap:8px;align-items:center}
.gold{background:var(--panel);border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-weight:700;color:var(--gold)}
.icon{background:var(--panel);border:1px solid var(--line);width:36px;height:36px;border-radius:50%}
.stage{position:relative;height:330px;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(60% 55% at 50% 58%,rgba(255,122,26,.28),transparent 70%),linear-gradient(#1a110c,#0e0907);transition:box-shadow .3s}
.stage.danger{animation:dng 1.1s infinite}
@keyframes dng{50%{box-shadow:inset 0 0 70px rgba(255,40,40,.55)}}
.stage.shake{animation:shk .5s}
@keyframes shk{20%{transform:translate(-8px,3px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,2px)}80%{transform:translate(5px,-2px)}}
.embers i{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:var(--ember);opacity:0;animation:rise linear infinite}
@keyframes rise{10%{opacity:.9}100%{transform:translateY(-340px) translateX(var(--x));opacity:0}}
.lv{position:absolute;top:12px;left:0;right:0;text-align:center;z-index:3}
.lv small{display:block;font-family:Cinzel,Georgia,serif;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-size:12px}
.lv b{font-family:Cinzel,Georgia,serif;font-size:44px;line-height:1;color:var(--gold);text-shadow:0 0 18px rgba(255,201,77,.5)}
#sword{position:absolute;left:50%;bottom:64px;height:200px;transform:translateX(-50%);transition:filter .4s;z-index:2}
#sword svg{height:100%;width:auto;display:block;overflow:visible}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:flk .35s infinite alternate}@keyframes flk{to{transform:scale(1.15,1.3)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spn 8s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}
.tw{animation:twk 1.1s infinite alternate}@keyframes twk{to{opacity:.3}}
.wps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.wp{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:6px 4px;text-align:center;font-size:12px;transition:.2s}.wp.on{border-color:var(--gold);box-shadow:0 0 12px rgba(255,201,77,.3)}.wp.lock{opacity:.4}.wp svg{height:78px;display:block;margin:0 auto 3px}.wp small{display:block;color:var(--muted);font-size:10px}
#sword.charge{animation:chg .25s infinite alternate}
@keyframes chg{from{transform:translateX(-50%) scale(1);filter:brightness(1)}to{transform:translateX(-50%) scale(1.04);filter:brightness(1.8) saturate(1.4)}}
#sword.pop{animation:pop .5s}
@keyframes pop{40%{transform:translateX(-50%) scale(1.15)}}
.anvil{position:absolute;left:50%;bottom:0;width:230px;transform:translateX(-50%);z-index:1}
#hammer{position:absolute;right:8%;bottom:70px;width:78px;transform-origin:38px 86px;transform:rotate(-55deg);z-index:4;transition:transform .2s}
#hammer.swing{animation:sw .6s ease-in}
@keyframes sw{0%{transform:rotate(-55deg)}45%{transform:rotate(-70deg)}58%{transform:rotate(18deg)}75%{transform:rotate(10deg)}100%{transform:rotate(-55deg)}}
.p{position:absolute;width:var(--s);height:var(--s);border-radius:50%;pointer-events:none;z-index:6;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),calc(var(--dy) + 90px));opacity:0}}
.flash{position:absolute;inset:0;z-index:5;pointer-events:none;animation:fl .55s ease-out forwards}
@keyframes fl{from{opacity:.75}to{opacity:0}}
.res{position:absolute;left:0;right:0;top:46%;text-align:center;z-index:7;font-family:Cinzel,Georgia,serif;font-weight:800;font-size:34px;letter-spacing:2px;pointer-events:none;animation:rs 1.5s ease-out forwards;text-shadow:0 3px 14px #000}
@keyframes rs{0%{transform:scale(.4);opacity:0}15%{transform:scale(1.15);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
.res.ok{color:var(--good)}.res.jk{color:var(--jack)}.res.no{color:var(--muted)}.res.dm{color:var(--warn)}.res.bk{color:var(--bad)}.res.rw{color:#7fd0ff}
.chips{display:flex;gap:8px}
.chip{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 4px;text-align:center}
.chip small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}.chip b{font-size:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.card h3{margin:0 0 9px;font-family:Cinzel,Georgia,serif;font-size:14px;letter-spacing:1px;display:flex;justify-content:space-between;align-items:baseline}
.card h3 small{font:12px "Trebuchet MS",sans-serif;color:var(--muted);letter-spacing:0}
.bar{display:flex;height:16px;border-radius:99px;overflow:hidden;background:#000}
.bar i{display:block;height:100%;transition:width .5s}
.legend{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:9px;text-align:center;font-size:11px;color:var(--muted)}
.legend b{display:block;font-size:15px;color:var(--ink)}
.items{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.it{position:relative;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:9px 10px;transition:.2s}
.it.on{border-color:var(--gold);box-shadow:0 0 14px rgba(255,201,77,.35);background:#35261a}
.it.out{opacity:.55}
.it .e{font-size:22px}.it b{display:block;font-size:13px}.it span{display:block;font-size:11px;color:var(--muted);min-height:30px}
.it .n{position:absolute;top:8px;right:10px;font-weight:700;color:var(--gold)}
.it .buy{margin-top:6px;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px;font-size:12px;color:var(--gold)}
.actions{position:sticky;bottom:0;display:grid;grid-template-columns:1.5fr 1fr;gap:10px;padding:10px 0 calc(6px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%);z-index:10}
.big{background:linear-gradient(#ff9a3c,#e2530c);border-radius:16px;padding:14px 8px;font-family:Cinzel,Georgia,serif;font-weight:800;font-size:19px;letter-spacing:1px;box-shadow:0 5px 0 #8c2f06,0 8px 22px rgba(255,100,20,.35);transition:transform .08s}
.big small{display:block;font:12px "Trebuchet MS",sans-serif;opacity:.9;letter-spacing:0}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 #8c2f06}
.big.hot{animation:hot .8s infinite;background:linear-gradient(#ff5a4d,#b3150c);box-shadow:0 5px 0 #5e0a05,0 8px 24px rgba(255,40,40,.5)}
@keyframes hot{50%{filter:brightness(1.35)}}
.cash{background:linear-gradient(#ffd96b,#c99a1a);color:#2b1a05;border-radius:16px;font-weight:800;box-shadow:0 5px 0 #7a5a0a;padding:8px}
.cash small{display:block;font-weight:600;font-size:12px}
.cash:active{transform:translateY(4px);box-shadow:none}
button:disabled{filter:grayscale(.8) brightness(.7);pointer-events:none}
.scav{background:var(--panel);border:1px dashed var(--grey);border-radius:12px;padding:9px;color:var(--muted)}
.coll{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cl{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;font-size:11px}
.cl svg{height:46px;margin-bottom:2px}.cl.lock{opacity:.45;filter:grayscale(1)}
#log{list-style:none;margin:0;padding:0;font-size:13px;display:grid;gap:5px}
#log li{padding:5px 8px;border-left:3px solid var(--grey);background:var(--panel2);border-radius:0 8px 8px 0}
#log li:first-child{animation:slide .3s}
@keyframes slide{from{transform:translateX(-14px);opacity:0}}
footer{text-align:center;color:var(--muted);font-size:12px}
#reset{background:none;color:var(--muted);text-decoration:underline;font-size:12px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#000d;border:1px solid var(--gold);color:var(--ink);padding:9px 16px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">⚔ <b>Forge</b> Your Sword</div><div class="hud"><span class="gold">🪙 <span id="gold">0</span></span><button class="icon" id="snd" aria-label="Sound">🔊</button></div></header>

<section class="stage" id="stage">
<div class="embers" id="embers"></div>
<div class="lv"><small id="tname"></small><b id="lvl">+0</b></div>
<div id="sword"></div>
<svg class="anvil" viewBox="0 0 230 70"><path d="M10 6H220L196 32H156L166 52H64L74 32H34Z" fill="#454b57"/><path d="M10 6H220L214 14H16Z" fill="#6c7482"/><rect x="48" y="52" width="134" height="16" rx="4" fill="#2d313b"/></svg>
<div id="hammer"><svg viewBox="0 0 78 92"><rect x="33" y="22" width="10" height="68" rx="4" fill="#7a4a28"/><rect x="6" y="4" width="66" height="26" rx="5" fill="#8d96a5"/><rect x="6" y="4" width="66" height="8" rx="4" fill="#bcc4d1"/></svg></div>
</section>

<section class="card"><h3>Armoury <small id="wnote"></small></h3><div class="wps" id="wps"></div></section>
<div class="chips" id="chips"></div>
<section class="card"><h3>Odds <small id="oddsnote"></small></h3><div class="bar" id="bar"></div><div class="legend" id="legend"></div></section>
<section class="card"><h3>Charms &amp; Tools <small>tap to equip</small></h3><div class="items" id="items"></div></section>
<div class="actions"><button class="big" id="forge"></button><button class="cash" id="cash"></button></div>
<section class="card"><h3>Forge log</h3><ul id="log"></ul></section>
<footer><button id="reset">Reset game</button><p>Virtual gold only. No real money, ever.</p></footer>
</div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),wait=ms=>new Promise(r=>setTimeout(r,ms));
const SU=[90,85,80,75,70,62,55,48,42,36,30,25,20,15,10],BR=[0,0,0,3,5,8,11,14,18,22,26,30,34,38,42],DA=[0,0,5,8,10,12,14,16,16,16,16,16,16,16,16];
const VAL=[5,15,35,70,120,200,330,520,820,1300,2100,3400,5500,9000,15000,30000];
const TIERS=[{n:'Rusty Blade',min:0,blade:'#8a6f5a',edge:'#b89a80',guard:'#5a4333',glow:'#ff9a3c'},{n:'Iron Sword',min:3,blade:'#aab2bd',edge:'#dfe6ee',guard:'#6b5a4a',glow:'#9fb4ff'},{n:'Steel Blade',min:6,blade:'#c8d6e5',edge:'#fff',guard:'#c9a227',glow:'#6fe3ff'},{n:'Mythril Edge',min:9,blade:'#58e6c4',edge:'#e9fff8',guard:'#2fb89a',glow:'#47ffd0'},{n:'Dragonbone',min:12,blade:'#ff8a5b',edge:'#ffe0b0',guard:'#8b1e1e',glow:'#ff4d2e'},{n:'Celestial Blade',min:15,blade:'#ffe27a',edge:'#fff',guard:'#c77dff',glow:'#ffd84d'}];
const ITEMS=[{id:'whet',e:'🪨',n:'Blessed Whetstone',d:'Halves the break chance',p:60},{id:'ward',e:'🛡️',n:'Anvil Ward',d:'Prevents level loss',p:80},{id:'charm',e:'🍀',n:'Lucky Charm',d:'+10% success chance',p:50},{id:'hour',e:'⏳',n:'Time Hourglass',d:'Rewinds a bad result',p:150},{id:'ember',e:'🔥',n:'Dragon Ember',d:'Guaranteed success',p:400}];
const tierIdx=l=>{let t=0;TIERS.forEach((x,i)=>{if(l>=x.min)t=i});return t};
const TN=['Rusty','Iron','Steel','Mythril','Dragonbone','Celestial'];
const WEAPONS=[{id:'sword',n:'Sword',mult:1,brk:0,tag:'balanced'},{id:'hammer',n:'War Hammer',mult:1.3,brk:4,tag:'heavy'},{id:'axe',n:'Battle Axe',mult:1.15,brk:2,tag:'bold'},{id:'spear',n:'Spear',mult:.9,brk:-3,tag:'steady'},{id:'club',n:'Trunk Club',mult:.7,brk:-5,tag:'very safe',pre:['Rough','Banded','Spiked','Mythril','Magma','Celestial']},{id:'staff',n:'Mage Staff',mult:1.6,brk:7,tag:'volatile',pre:['Gnarled','Silver','Sage','Mythril','Dragonfire','Celestial']}];
const wp=()=>WEAPONS.find(w=>w.id===S.type)||WEAPONS[0];
const wname=(id,t)=>{const w=WEAPONS.find(x=>x.id===id);return (w.pre||TN)[t]+' '+w.n};
let uid=0;
function weaponSVG(type,t){const P=TIERS[t],g='g'+(++uid),B=P.blade,E=P.edge,G=P.guard,L=P.glow,F=`url(#${g})`,K='stroke="rgba(0,0,0,.4)" stroke-width="1.2"',W='#6b4a2f';
let b='',hx=50,hy=60,gy=174;
if(type==='sword'){hy=70;b=`<polygon points="50,4 61,32 58,170 42,170 39,32" fill="${F}" ${K}/><line x1="50" y1="28" x2="50" y2="162" stroke="rgba(0,0,0,.25)" stroke-width="2"/>${t>=3?`<path d="M20 168L6 154L24 166ZM80 168L94 154L76 166Z" fill="${G}"/>`:''}<rect x="20" y="168" width="60" height="12" rx="6" fill="${G}" ${K}/><rect x="45" y="180" width="10" height="38" rx="3" fill="${W}"/><circle cx="50" cy="224" r="9" fill="${G}" ${K}/>`}
else if(type==='hammer'){hy=45;gy=45;b=`<rect x="44" y="66" width="12" height="156" rx="5" fill="${W}"/><circle cx="50" cy="226" r="8" fill="${G}" ${K}/><rect x="10" y="20" width="80" height="50" rx="9" fill="${F}" ${K}/><rect x="10" y="20" width="14" height="50" rx="6" fill="${G}"/><rect x="76" y="20" width="14" height="50" rx="6" fill="${G}"/>${t>=2?`<polygon points="38,20 50,0 62,20" fill="${E}" ${K}/>`:''}`}
else if(type==='axe'){hy=58;gy=60;b=`<rect x="46" y="22" width="8" height="200" rx="4" fill="${W}"/><circle cx="50" cy="226" r="7" fill="${G}" ${K}/><polygon points="50,0 57,24 43,24" fill="${E}" ${K}/><path d="M48 26C6 4-8 80 48 98Z" fill="${F}" ${K}/>${t>=3?`<path d="M52 26C94 4 108 80 52 98Z" fill="${F}" ${K}/>`:''}`}
else if(type==='spear'){hy=36;gy=68;b=`<rect x="47" y="60" width="6" height="170" rx="3" fill="${W}"/>${t>=2?`<path d="M50 73Q36 91 42 107Q50 97 50 73Q58 97 64 103Q68 85 50 73Z" fill="${L}"/>`:''}${t>=3?`<polygon points="36,48 20,38 34,62" fill="${E}" ${K}/><polygon points="64,48 80,38 66,62" fill="${E}" ${K}/>`:''}<polygon points="50,0 66,50 50,66 34,50" fill="${F}" ${K}/><rect x="42" y="64" width="16" height="9" rx="3" fill="${G}"/>`}
else if(type==='club'){hy=40;gy=62;b=`<path d="M34 12Q50 0 66 12L72 62Q76 140 60 226L40 226Q24 140 28 62Z" fill="#7a5230" ${K}/><path d="M42 30Q40 120 46 210M58 30Q62 120 54 210" stroke="rgba(0,0,0,.25)" fill="none"/><ellipse cx="44" cy="90" rx="5" ry="7" fill="rgba(0,0,0,.3)"/>${t>=1?`<rect x="28" y="50" width="44" height="9" rx="3" fill="${B}"/><rect x="31" y="112" width="38" height="9" rx="3" fill="${B}"/>`:''}${t>=2?`<polygon points="28,36 12,30 29,48" fill="${E}" ${K}/><polygon points="72,36 88,30 71,48" fill="${E}" ${K}/><polygon points="29,76 13,80 30,90" fill="${E}" ${K}/><polygon points="71,76 87,80 70,90" fill="${E}" ${K}/>`:''}${t>=4?`<path class="tw" d="M50 12L45 48L55 80L48 124" stroke="${L}" stroke-width="3" fill="none"/>`:''}${t>=5?`<polygon points="50,-2 58,10 50,22 42,10" fill="${L}" stroke="#fff"/>`:''}`}
else{hy=34;gy=48;b=`<rect x="46" y="46" width="8" height="180" rx="4" fill="${W}"/>${t>=2?`<rect x="43" y="130" width="14" height="6" rx="2" fill="${B}"/><rect x="43" y="150" width="14" height="6" rx="2" fill="${B}"/>`:''}<circle cx="50" cy="34" r="19" fill="none" stroke="${B}" stroke-width="4"/><circle cx="50" cy="34" r="${7+t*1.8}" fill="${t?L:'#5a4333'}" ${t>=3?'class="tw"':''}/>${t>=3?`<polygon class="tw" points="20,20 26,32 18,34" fill="${E}"/><polygon class="tw" points="80,12 85,26 76,26" fill="${E}"/>`:''}`}
let back='',front='';
if(t>=4)back+=`<path class="fl" d="M${hx-34} ${hy+30}Q${hx-48} ${hy-10} ${hx-24} ${hy-34}Q${hx-26} ${hy} ${hx-14} ${hy+14}Z" fill="${L}" opacity=".75"/><path class="fl" d="M${hx+34} ${hy+30}Q${hx+48} ${hy-10} ${hx+24} ${hy-34}Q${hx+26} ${hy} ${hx+14} ${hy+14}Z" fill="${L}" opacity=".75"/>`;
if(t>=5)back+=`<circle class="spin" cx="${hx}" cy="${hy}" r="44" fill="none" stroke="${L}" stroke-width="2" stroke-dasharray="6 6"/><path d="M${hx-8} ${gy}Q${hx-70} ${gy-44} ${hx-56} ${gy-4}Q${hx-40} ${gy+4} ${hx-8} ${gy+10}Z" fill="${E}" opacity=".85"/><path d="M${hx+8} ${gy}Q${hx+70} ${gy-44} ${hx+56} ${gy-4}Q${hx+40} ${gy+4} ${hx+8} ${gy+10}Z" fill="${E}" opacity=".85"/>`;
if(t>=2)front+=`<circle cx="${hx}" cy="${gy}" r="${2+t*.8}" fill="${L}" stroke="#fff" stroke-width=".8"/>`;
if(t>=3)(type==='sword'?[85,108,131]:[120,150,180]).forEach(y=>front+=`<rect class="tw" x="48.5" y="${y}" width="3" height="10" rx="1.5" fill="${L}"/>`);
if(t>=5)front+=`<circle class="tw" cx="14" cy="60" r="2" fill="#fff"/><circle class="tw" cx="88" cy="110" r="2.4" fill="#fff"/><circle class="tw" cx="22" cy="150" r="1.8" fill="#fff"/>`;
return `<svg viewBox="-20 -10 140 260"><defs><linearGradient id="${g}" x1="0" x2="1"><stop offset="0" stop-color="${B}"/><stop offset=".5" stop-color="${E}"/><stop offset="1" stop-color="${B}"/></linearGradient></defs>${back}${b}${front}</svg>`}
const fresh=()=>({gold:100,lvl:0,best:0,type:'sword',seen:{sword:[0]},inv:{whet:1,ward:0,charm:1,hour:0,ember:0},pity:0,streak:0,breaks:0});
let S=fresh(),eq={},busy=false,muted=false,logs=[];
try{const x=JSON.parse(localStorage.getItem('fys_save')||'null');if(x&&x.inv){S=Object.assign(fresh(),x);if(Array.isArray(S.seen))S.seen={sword:S.seen};if(!S.type)S.type='sword'}muted=localStorage.getItem('fys_mute')==='1'}catch(e){}
const save=()=>{try{localStorage.setItem('fys_save',JSON.stringify(S));localStorage.setItem('fys_mute',muted?'1':'0')}catch(e){}};

/* ---------- sound ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='sine',v=.15,t=0,to){const a=ac();if(!a||muted)return;const o=a.createOscillator(),g=a.createGain(),s=a.currentTime+t;o.type=type;o.frequency.setValueAtTime(f,s);if(to)o.frequency.exponentialRampToValueAtTime(to,s+d);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g).connect(a.destination);o.start(s);o.stop(s+d+.02)}
function noise(d,v=.2,t=0,fr=1000,type='lowpass'){const a=ac();if(!a||muted)return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),st=a.currentTime+t;s.buffer=b;f.type=type;f.frequency.value=fr;g.gain.setValueAtTime(v,st);g.gain.exponentialRampToValueAtTime(.001,st+d);s.connect(f).connect(g).connect(a.destination);s.start(st)}
const sfx={clank(){noise(.09,.35,0,3000,'highpass');tone(220,.15,'triangle',.25,0,60)},good(){[660,830,990,1320].forEach((f,i)=>tone(f,.35,'sine',.16,i*.08))},jack(){[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.5,'triangle',.18,i*.07))},fail(){tone(220,.35,'sawtooth',.12,0,110)},dam(){tone(330,.5,'sawtooth',.14,0,70);noise(.2,.2,0,800)},brk(){noise(.7,.5,0,2500);tone(110,.6,'square',.15,0,35)},coin(){tone(1250,.12,'square',.08);tone(1700,.25,'square',.08,.07)},beat(){tone(62,.18,'sine',.45);tone(62,.18,'sine',.35,.22)},buy(){tone(520,.1,'square',.07)},rew(){tone(1200,.6,'sine',.15,0,300)}};

/* ---------- odds ---------- */
function odds(){const L=S.lvl;const W=wp();let succ=SU[L],brk=BR[L]>0?Math.max(0,BR[L]+W.brk):0,dam=DA[L],jack=L<=13?3:0;
if(eq.ember)return{jack:0,succ:100,fail:0,dam:0,brk:0};
if(eq.whet)brk=brk/2;if(eq.ward)dam=0;
succ+=Math.min(10,S.pity*2)+(eq.charm?10:0);
let fail=100-succ-jack-dam-brk;if(fail<0){succ+=fail;fail=0}
const r=x=>Math.round(x*10)/10;return{jack:r(jack),succ:r(succ),fail:r(fail),dam:r(dam),brk:r(brk)}}
function roll(o){let r=Math.random()*100;for(const k of['jack','succ','fail','dam','brk']){if((r-=o[k])<0)return k}return'fail'}

/* ---------- effects ---------- */
function burst(n,cols,spread){const st=$('#stage'),w=st.clientWidth,h=st.clientHeight;for(let i=0;i<n;i++){const e=document.createElement('i');e.className='p';e.style.cssText=`left:${w/2}px;top:${h*.5}px;background:${cols[i%cols.length]};--dx:${(Math.random()-.5)*spread}px;--dy:${-Math.random()*spread*.8}px;--s:${3+Math.random()*6}px`;st.appendChild(e);setTimeout(()=>e.remove(),1000)}}
function flash(c){const e=document.createElement('div');e.className='flash';e.style.background=c;$('#stage').appendChild(e);setTimeout(()=>e.remove(),600)}
function showRes(t,c){const e=document.createElement('div');e.className='res '+c;e.textContent=t;$('#stage').appendChild(e);setTimeout(()=>e.remove(),1600)}
function shake(){const s=$('#stage');s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake')}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function addLog(t,c){logs.unshift([t,c]);logs=logs.slice(0,6)}

/* ---------- game ---------- */
async function forge(){
if(busy||S.lvl>=15)return;const L=S.lvl;
busy=true;ac();const o=odds();
Object.keys(eq).filter(k=>eq[k]&&k!=='hour').forEach(k=>S.inv[k]--);
render();const sw=$('#sword'),hm=$('#hammer');
hm.classList.add('swing');await wait(340);sfx.clank();burst(16,['#ffd27a','#ff9a3c','#fff'],170);
await wait(300);hm.classList.remove('swing');
sw.classList.add('charge');if(L>=8){sfx.beat();setTimeout(sfx.beat,520)}
await wait(550+L*90);sw.classList.remove('charge');
const res=roll(o);let rew=false;
if((res==='dam'||res==='brk')&&eq.hour&&S.inv.hour>0){S.inv.hour--;rew=true}
ITEMS.forEach(i=>{if(S.inv[i.id]<=0)eq[i.id]=false});
const t0=tierIdx(L);
if(rew){sfx.rew();flash('rgba(127,208,255,.6)');showRes('TIME REWOUND','rw');addLog('⏳ Hourglass saved your sword at +'+L,'#7fd0ff')}
else if(res==='succ'||res==='jack'){const up=res==='jack'?2:1;S.lvl=Math.min(15,S.lvl+up);S.streak++;S.pity=0;
 if(res==='jack'){sfx.jack();flash('rgba(199,125,255,.6)');showRes('JACKPOT +2','jk');burst(50,['#c77dff','#ffd84d','#fff','#7fd0ff'],300)}
 else{sfx.good();flash('rgba(91,227,125,.4)');showRes('SUCCESS','ok');burst(26,['#ffd84d','#5be37d','#fff'],220)}
 sw.classList.remove('pop');void sw.offsetWidth;sw.classList.add('pop');
 addLog((res==='jack'?'🎰 Jackpot! ':'✅ Success! ')+'+'+L+' → +'+S.lvl,res==='jack'?'#c77dff':'#5be37d')}
else if(res==='fail'){sfx.fail();S.pity++;S.streak=0;showRes('NO CHANGE','no');addLog('➖ Nothing happened at +'+L,'#6d6358')}
else if(res==='dam'){sfx.dam();S.lvl--;S.pity++;S.streak=0;flash('rgba(255,174,66,.4)');showRes('DAMAGED -1','dm');shake();addLog('⚠️ Damaged! +'+L+' → +'+S.lvl,'#ffae42')}
else{sfx.brk();S.lvl=0;S.pity++;S.streak=0;S.breaks++;flash('rgba(255,50,50,.65)');showRes('SHATTERED!','bk');shake();burst(44,['#ff4d4d','#aab2bd','#ffae42'],340);addLog('💥 Your '+wp().n+' broke at +'+L+'! A fresh one is yours','#ff4d4d')}
S.best=Math.max(S.best,S.lvl);const ti=tierIdx(S.lvl),sn=S.seen[S.type]||(S.seen[S.type]=[0]);
if(!sn.includes(ti)){sn.push(ti);toast('New unlock: '+wname(S.type,ti)+'!')}
busy=false;save();render()}
function cashOut(){if(busy)return;const v=cashVal();S.gold+=v;S.lvl=0;S.streak=0;sfx.coin();burst(22,['#ffd84d','#ffc94d'],200);addLog('🪙 Sold for '+v.toLocaleString()+' gold','#ffc94d');toast('Sold for '+v.toLocaleString()+' gold. A fresh weapon is ready.');save();render()}
const cashVal=()=>Math.round(VAL[S.lvl]*wp().mult*(1+Math.min(.5,S.streak*.05)));

/* ---------- render ---------- */
function render(){
const L=S.lvl,t=TIERS[tierIdx(L)],o=odds(),sw=$('#sword');
$('#gold').textContent=S.gold.toLocaleString();$('#lvl').textContent='+'+L;$('#tname').textContent=wname(S.type,tierIdx(L));
const kk=S.type+tierIdx(L);if(sw.dataset.k!==kk){sw.dataset.k=kk;sw.innerHTML=weaponSVG(S.type,tierIdx(L))}
sw.style.filter=`drop-shadow(0 0 ${4+L*2}px ${t.glow})`;
$('#stage').classList.toggle('danger',L<15&&o.brk>=20);
$('#chips').innerHTML=[['Streak','🔥 '+S.streak],['Pity','+'+Math.min(10,S.pity*2)+'%'],['Best','+'+S.best],['Broken','💥 '+S.breaks]].map(x=>`<div class="chip"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');
const seg=[['jack','Jackpot','var(--jack)'],['succ','Success','var(--good)'],['fail','Nothing','var(--grey)'],['dam','Damage','var(--warn)'],['brk','Break','var(--bad)']];
const max=L>=15;
$('#bar').innerHTML=max?'':seg.map(s=>`<i style="width:${o[s[0]]}%;background:${s[2]}"></i>`).join('');
$('#legend').innerHTML=max?'':seg.map(s=>`<div><b style="color:${s[2]}">${o[s[0]]}%</b>${s[1]}</div>`).join('');
$('#oddsnote').textContent=max?'Maximum level reached. Cash out!':'Attempt +'+L+' → +'+(L+1)+' · '+wp().n;
$('#items').innerHTML=ITEMS.map(i=>`<div class="it ${eq[i.id]?'on':''} ${S.inv[i.id]?'':'out'}" data-eq="${i.id}"><span class="n">×${S.inv[i.id]}</span><span class="e">${i.e}</span><b>${i.n}</b><span>${i.d}</span><button class="buy" data-buy="${i.id}">Buy · ${i.p} 🪙</button></div>`).join('');
let tot=0;$('#wps').innerHTML=WEAPONS.map(w=>{const sn=S.seen[w.id]||[],bt=sn.length?Math.max(...sn):0;tot+=sn.length;return`<div class="wp ${S.type===w.id?'on':''} ${(S.lvl>0||busy)&&S.type!==w.id?'lock':''}" data-w="${w.id}">${weaponSVG(w.id,bt)}<b>${w.n}</b><small>×${w.mult} value · ${w.tag}</small><small>★ ${sn.length}/6</small></div>`}).join('');
$('#wnote').textContent=S.lvl>0?'Cash out or break to switch · '+tot+'/'+WEAPONS.length*6:'Pick your weapon · '+tot+'/'+WEAPONS.length*6;
const f=$('#forge');
f.disabled=busy||max;f.className='big'+(!max&&o.brk>=20?' hot':'');
f.innerHTML=max?'MAX LEVEL':'FORGE<small>Free to try · risk only</small>';
const cb=$('#cash');cb.disabled=busy;cb.innerHTML=`CASH OUT<small>${cashVal().toLocaleString()} 🪙${S.streak?' (×'+(1+Math.min(.5,S.streak*.05)).toFixed(2)+')':''}</small>`;
$('#log').innerHTML=logs.length?logs.map(l=>`<li style="border-color:${l[1]}">${l[0]}</li>`).join(''):'<li>Your first swing awaits…</li>'}

/* ---------- wiring ---------- */
$('#forge').onclick=forge;$('#cash').onclick=cashOut;
$('#items').onclick=e=>{if(busy)return;const b=e.target.closest('[data-buy]');
if(b){const i=ITEMS.find(x=>x.id===b.dataset.buy);if(S.gold<i.p){toast('Not enough gold');return}ac();S.gold-=i.p;S.inv[i.id]++;sfx.buy();save();render();return}
const c=e.target.closest('[data-eq]');if(!c)return;const id=c.dataset.eq;
if(!S.inv[id]){toast('Buy one first');return}eq[id]=!eq[id];if(id==='ember'&&eq[id])toast('Dragon Ember: success is guaranteed!');ac();sfx.buy();render()};
$('#wps').onclick=e=>{const c=e.target.closest('[data-w]');if(!c||busy)return;const id=c.dataset.w;if(id===S.type)return;if(S.lvl>0){toast('Cash out (or break) your current weapon first');return}S.type=id;S.seen[id]=S.seen[id]||[0];ac();sfx.buy();save();render()};
$('#snd').onclick=()=>{muted=!muted;$('#snd').textContent=muted?'🔇':'🔊';ac();save()};
let rc=false;$('#reset').onclick=()=>{if(!rc){rc=true;$('#reset').textContent='Tap again to confirm reset';setTimeout(()=>{rc=false;$('#reset').textContent='Reset game'},3000);return}S=fresh();eq={};logs=[];rc=false;$('#reset').textContent='Reset game';save();render()};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();forge()}});
$('#snd').textContent=muted?'🔇':'🔊';
$('#embers').innerHTML=Array.from({length:14},()=>`<i style="left:${Math.random()*100}%;--x:${(Math.random()-.5)*60}px;animation-duration:${4+Math.random()*5}s;animation-delay:${Math.random()*5}s"></i>`).join('');
render();
</script>
</body>
</html>
